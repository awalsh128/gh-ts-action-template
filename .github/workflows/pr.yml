# Branch and title policy for pull requests. Trusts only the pull request's metadata, passed through env.
name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check-branch:
    name: Check branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # main only moves by fast-forward to staging; a merge into main would add a commit staging lacks.
      - name: Require staging as the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != "staging" ]; then
            echo "::error::Pull requests target staging, not $BASE_REF; main is updated by promotion."
            exit 1
          fi

  commitlint:
    name: Lint pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Setup downloads the build artifact of an earlier run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Pull requests are squash-merged with the title as the commit subject, and semantic-release
      # versions from it, so only the title has to be a Conventional Commit. The edited trigger reruns
      # this check when the title changes.
      - name: Lint pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint --verbose

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
