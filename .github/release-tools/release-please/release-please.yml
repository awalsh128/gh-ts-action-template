# Keeps a Release PR open on staging. Merging it tags the commit and creates the GitHub Release; the files
# consumers run are then archived from that tag and attested. The Release PR goes through staging's required
# checks, so CI gates every release. No secrets: the Octo STS token, not GITHUB_TOKEN, is what lets CI run on
# the Release PR. Releases stay held until RELEASES_ENABLED is 'true'.
name: Release Please

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions: {}

# One run at a time; never cancel one that is tagging.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ vars.RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # For uploading the archive to the GitHub Release
      id-token: write # For OIDC: the Octo STS token and the attestation
      attestations: write # For the build provenance attestation
    steps:
      - name: Create release token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: release-please

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          target-branch: staging
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout the release
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          persist-credentials: false

      # The Release PR passed CI, whose bundle check proves dist/ matches the source, so nothing is built here.
      - name: Archive the release
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: git archive --format=tar.gz --output="action-${TAG}.tar.gz" HEAD action.yml dist package.json package-lock.json

      - name: Attest the archive
        if: steps.release.outputs.release_created == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: action-${{ steps.release.outputs.tag_name }}.tar.gz

      - name: Upload the archive to the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "$TAG" "action-${TAG}.tar.gz"
