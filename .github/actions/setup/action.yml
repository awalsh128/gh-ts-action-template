name: Setup
description: Install Node and dependencies, then reuse or build the action bundle.
inputs:
  ignore-scripts:
    description: "Install with --ignore-scripts. Set for jobs that can mint release or tag tokens."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node_ver
        cache: npm
    - run: npm ci ${IGNORE_SCRIPTS_FLAG}
      shell: bash
      env:
        IGNORE_SCRIPTS_FLAG: ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
    - id: download
      uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
      with:
        name: build-dist-${{ github.sha }}
        path: dist
        workflow_conclusion: ""
        if_no_artifact_found: ignore
    - if: steps.download.outputs.found_artifact != 'true'
      run: npm run build
      shell: bash
    - if: steps.download.outputs.found_artifact != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-dist-${{ github.sha }}
        path: dist
        retention-days: 1
        overwrite: true
