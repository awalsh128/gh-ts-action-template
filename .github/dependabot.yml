# Pull requests target staging, since main only fast-forwards to it. Titles use the build type, which
# doesn't trigger a release; retitle a pull request as fix: when a runtime dependency update should
# ship. Grouping keeps one pull request per ecosystem and update type. The cooldown skips releases
# younger than a week, giving a compromised release time to be caught and pulled.
version: 2

updates:
  # Workflows and the composite actions under .github/actions, whose SHA pins this keeps current.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # The action's own dependencies, including the exact-pinned @awalsh128/winston-github-actions.
  - package-ecosystem: npm
    directories:
      - "/"
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # Majors follow engines.node, the oldest Node the action supports.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # semantic-release 26 needs Node >=26.13, and publish.yml runs on the Node in .node_ver (24). Drop this
      # when the release job moves to a newer Node.
      - dependency-name: "semantic-release"
        update-types: ["version-update:semver-major"]
